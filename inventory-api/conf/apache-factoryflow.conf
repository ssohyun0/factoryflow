# ------------------------------------------------------------
# Apache 설정 (erp-inventory-api)
# 실제 파일이 없는 모든 요청(/api/auth/login, /internal/stock/produce 등)을
# /index.php 하나로 보내 PHP 라우터가 경로를 해석하게 한다.
# ------------------------------------------------------------
ServerName erp-inventory-api

<Directory /var/www/html>
    FallbackResource /index.php
</Directory>
