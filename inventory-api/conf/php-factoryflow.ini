; ------------------------------------------------------------
; PHP 설정 (erp-inventory-api)
; ------------------------------------------------------------

; 시간대: 한국 시간
date.timezone = Asia/Seoul

; 오류는 응답에 노출하지 않고 컨테이너 로그(docker logs)로만 남긴다
display_errors = Off
log_errors = On
expose_php = Off

; 세션 쿠키 보안 옵션
;  - use_strict_mode : 서버가 만들지 않은 세션 ID는 받아들이지 않는다 (세션 고정 공격 방지)
;  - cookie_httponly : 자바스크립트에서 쿠키를 읽을 수 없게 한다 (XSS로 세션 탈취 방지)
;  - cookie_samesite : 다른 사이트에서 보낸 요청에는 쿠키를 싣지 않는다 (CSRF 완화)
;  - gc_maxlifetime  : 세션 유효시간 3600초 (Redis TTL과 같게 맞춤)
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.cookie_path = "/"
session.gc_maxlifetime = 3600

; 직렬화 형식은 PHP 기본값(php)을 그대로 쓴다.
; 예) userId|i:1;username|s:5:"santa";
; FastAPI(erp-production-api)가 이 형식을 직접 해석해 같은 세션을 읽는다.
session.serialize_handler = php
