# ------------------------------------------------------------
# nginx.conf — erp-proxy (역방향 프록시) 설정
# 역할 : 외부에 공개되는 유일한 입구(호스트 80번 포트). 브라우저는 http://factoryflow.test 한 곳만 알고,
#        이 프록시가 경로를 보고 erp-net 안의 컨테이너로 나눠 보낸다.
#
#   경로                              전달 대상
#   /api/inventory/internal/*, /internal/*  403 (생산 서버 전용 내부 API, 외부 차단)
#   /api/auth/*, /api/inventory/*     erp-inventory-api:80 (PHP)
#   /api/production/*                 upstream production_pool → erp-production-api-1~3 (라운드로빈)
#   /                                 erp-frontend:80 (화면 파일)
#
# 위치 : 이미지 안 /etc/nginx/conf.d/default.conf (Dockerfile 에서 복사)
# 주의 : Nginx 는 시작할 때 한 번만 컨테이너 이름을 IP 로 바꾼다(DNS 해석).
#        그래서 생산 서버 3개·재고 서버·프론트가 먼저 떠 있어야 하고,
#        그 컨테이너를 다시 만들면(IP 변경) docker restart erp-proxy 가 필요하다.
# ------------------------------------------------------------

# 생산 서버 묶음. 별칭 erp-production-pool 하나만 적으면
# Nginx 가 시작할 때 이 이름을 IP 3개로 해석해 서버 3대로 등록한다. 기본 정책은 라운드로빈.
#   max_fails=1 fail_timeout=10s : 한 번 연결에 실패한 서버는 10초 동안 빼고 나머지로 보낸다
#                                  (docker stop erp-production-api-2 를 해도 서비스가 계속됨)
upstream production_pool {
    server erp-production-pool:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name factoryflow.test;   # 서버 블록이 하나뿐이라 IP(192.168.71.129)로 접속해도 같은 화면이 나온다

    # 백엔드에 원래 요청 정보를 넘긴다 (접속 기록·로그용)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 멈춘 컨테이너에 연결을 오래 기다리지 않는다 (기본 60초 → 2초 만에 다음 서버로)
    proxy_connect_timeout 2s;

    # 응답 헤더에 실제로 처리한 백엔드 주소를 붙인다 (분산 확인용, curl -i 로 볼 수 있음)
    add_header X-Upstream $upstream_addr always;

    # 1) 내부 API 차단 — 생산 서버가 erp-net 안에서만 부르는 재고 차감 API 를 브라우저가 직접 부르지 못하게 한다
    #    (재고 서버도 X-Internal-Token 을 한 번 더 검사한다: 이중 방어)
    location ^~ /api/inventory/internal/ {
        default_type application/json;
        return 403 '{"success":false,"error":{"code":"FORBIDDEN","message":"내부 API는 외부에서 호출할 수 없습니다."},"servedBy":"erp-proxy"}';
    }
    location ^~ /internal/ {
        default_type application/json;
        return 403 '{"success":false,"error":{"code":"FORBIDDEN","message":"내부 API는 외부에서 호출할 수 없습니다."},"servedBy":"erp-proxy"}';
    }

    # 2) 재고 서버 (PHP): 로그인·로그아웃·세션 발급, 품목·재고·입고
    location /api/auth/ {
        proxy_pass http://erp-inventory-api:80;
    }
    location /api/inventory/ {
        proxy_pass http://erp-inventory-api:80;
    }

    # 3) 생산 서버 3대 (FastAPI): 요청마다 다음 서버로 돌아가며 보낸다
    #    연결 실패·시간 초과면 다른 서버로 다시 보낸다 (요청을 보내기 전 실패라 POST 도 안전)
    location /api/production/ {
        proxy_pass http://production_pool;
        proxy_next_upstream error timeout;
    }

    # 4) 그 밖의 경로는 화면 파일
    location / {
        proxy_pass http://erp-frontend:80;
    }
}
