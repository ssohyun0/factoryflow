# ------------------------------------------------------------
# nginx-frontend.conf — erp-frontend 컨테이너의 정적 파일 서버 설정
# 역할 : index.html, css/, js/ 를 그대로 내려준다. API 는 다루지 않는다(erp-proxy 가 나눔).
# 위치 : 이미지 안 /etc/nginx/conf.d/default.conf (Dockerfile 에서 복사)
# ------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 화면 파일을 고치고 이미지를 다시 만들었을 때 브라우저가 옛 파일을 쓰지 않도록,
    # 매번 서버에 바뀌었는지 확인하게 한다 (바뀌지 않았으면 304 로 빠르게 응답)
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
